name = "secure-note"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
BASE_URL = "https://secure.gremlin.group"
MAX_NOTE_SIZE = "1048576"
DEFAULT_TTL = "604800"

# Rate limiting: run scripts/setup-rate-limits.sh with a WAF-scoped API token
# Rules:
#   GET  /api/notes/* returning 404: 10/min per IP, block 5 min (brute-force)
#   DELETE /api/notes/* returning 403/404: 5/min per IP, block 10 min (blind deletion)
#   POST /api/notes: 10/min per IP, block 5 min (create spam)

[[kv_namespaces]]
binding = "NOTES"
id = "b6e8ffcea285447e8675869bcd9ef7a5"
